worker_processes 1;
worker_rlimit_nofile 100000;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 10000;
    multi_accept on;
    use epoll;
}

http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    upstream api_backend {
        server api1:8080;
        server api2:8080;

        # Reuse TCP connections to backends instead of opening a new one per
        # request — critical for high-RPS tests.
        keepalive 1024;
        keepalive_requests 100000;
    }

    server {
        listen 9999;

        location / {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            # Clear Connection header so nginx sends keep-alive to upstream.
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            proxy_send_timeout    10s;
        }
    }
}
