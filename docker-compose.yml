services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "20MB"

  api1:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=8080
      # Cap Go's heap to 90% of the container limit so the GC acts before the
      # OOM killer does.  With int8 vectors we only use ~60 MB, so this is a
      # safety net, not a constraint.
      - GOMEMLIMIT=145MiB
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165MB"

  api2:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=8080
      - GOMEMLIMIT=145MiB
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165MB"

networks:
  rinha:
    driver: bridge
